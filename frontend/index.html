<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalSense - Real-Time rPPG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VitalSense Dashboard</h1>
            <div id="status" class="badge">Connecting...</div>
        </header>

        <div class="main-content">
            <div class="video-panel">
                <div class="video-wrapper">
                    <!-- Invisible video element for capturing -->
                    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                    <!-- Visible canvas for displaying stream with bounding box -->
                    <canvas id="output-canvas"></canvas>
                </div>
                <div class="controls">
                    <button id="start-btn" disabled>Start Camera</button>
                    <div class="metrics">
                        <span>FPS: <strong id="fps-val">0</strong></span>
                    </div>
                </div>
                <div class="debug-panel">
                    <h3>72x72 ROI (Sent to Server)</h3>
                    <canvas id="crop-canvas" width="72" height="72"></canvas>
                </div>
            </div>

            <div class="vital-panel">
                <div class="hr-display">
                    <h2>Heart Rate</h2>
                    <div class="bpm-value"><span id="hr-val">--</span> <small>BPM</small></div>
                    <div class="confidence">Confidence: <span id="conf-val">0</span>%</div>
                    <div class="progress-container">
                        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
                    </div>
                    <div id="message-val" class="message">Waiting for frames...</div>
                </div>

                <div class="charts">
                    <div class="chart-box">
                        <h3>Filtered BVP Signal</h3>
                        <!-- We will just make a quick implementation of chart.js or vanilla canvas -->
                        <canvas id="signal-chart" width="400" height="150"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>FFT Spectrum</h3>
                        <canvas id="fft-chart" width="400" height="150"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OpenCV for Client-side Face Detection -->
    <script src="https://docs.opencv.org/4.8.0/opencv.js" async onload="onOpenCvReady();"></script>
    <script src="js/webcam.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
